name: Flight alerts
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: flight-alerts
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: push/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - run: npm install --no-audit --no-fund
      - run: node notify.mjs
        env:
          CONTRAIL_PUSH: ${{ secrets.CONTRAIL_PUSH }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('push/state.json') != ''
        with:
          path: push/state.json
          key: alerts-state-${{ github.run_id }}
