<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrail">
<title>Contrail — Flight Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{
  --text:#f5f7ff;--mute:rgba(235,240,255,.62);--faint:rgba(235,240,255,.38);
  --acc:#7ef0dc;--acc2:#7cc4ff;--warn:#ffd36e;--bad:#ff8a8a;--good:#8ef0a8;
  --glass:rgba(255,255,255,.075);--glass-hi:rgba(255,255,255,.13);--stroke:rgba(255,255,255,.16);--stroke-lo:rgba(255,255,255,.06);
  --blur:saturate(180%) blur(26px);--r:24px;
  --shadow:0 1px 0 rgba(255,255,255,.28) inset,0 -1px 0 rgba(255,255,255,.04) inset,0 18px 40px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{background:#070b18}
/* Ambient color field that the glass refracts */
.aurora{position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px) saturate(140%);opacity:.9}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 28s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-10%;background:radial-gradient(circle,#2b5cff 0,transparent 65%)}
.aurora i:nth-child(2){width:50vmax;height:50vmax;right:-10%;top:10%;background:radial-gradient(circle,#13c8b5 0,transparent 65%);animation-duration:34s}
.aurora i:nth-child(3){width:45vmax;height:45vmax;left:20%;bottom:-15%;background:radial-gradient(circle,#8a3cff 0,transparent 65%);animation-duration:40s}
.aurora i:nth-child(4){width:30vmax;height:30vmax;right:15%;bottom:5%;background:radial-gradient(circle,#ff6aa2 0,transparent 65%);opacity:.55;animation-duration:46s}
@keyframes drift{to{transform:translate3d(6%,8%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}

/* Glass primitive */
.glass,.card,.stat,.seg,.btn,.icon-btn,nav.tabs,.sheet>div,.kv>div,.toast,.quick,.chip,.auth-card{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.card,.stat,.auth-card,.quick{position:relative;overflow:hidden}
.card::before,.stat::before,.auth-card::before,.quick::before,nav.tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 38%),radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.10),transparent 60%)}

body:not(.authed) header,body:not(.authed) .dock{display:none}
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 18px 6px;
  background:linear-gradient(180deg,rgba(7,11,24,.75),rgba(7,11,24,0));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hdr{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.hdr h1{flex:1;margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}
main{padding:6px 16px calc(120px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* Floating capsule tab bar */
nav.tabs{position:relative;flex:1;max-width:420px;
  display:flex;gap:2px;padding:6px;border-radius:999px;width:min(92vw,420px);background:rgba(255,255,255,.09)}
nav.tabs button{position:relative;z-index:1;flex:1;background:none;border:0;padding:8px 0 6px;border-radius:999px;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:color .2s,background .25s}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--text);background:rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.35) inset}

.btn{border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:600;transition:transform .15s,background .2s}
.btn:active,.icon-btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,rgba(126,240,220,.95),rgba(88,204,230,.9));color:#04231f;border-color:rgba(255,255,255,.5)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.card{border-radius:var(--r);padding:16px;margin-bottom:12px}
.fcard{cursor:pointer;transition:transform .2s}
.fcard:active{transform:scale(.985)}
.fcard .top{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin-bottom:10px}
.fcard .top .sp{flex:1}
.badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 2px 6px rgba(0,0,0,.3)}
.badge.lg{width:44px;height:44px;font-size:15px}
.route{display:flex;align-items:center;gap:10px}
.route .ap{min-width:0}
.route .code{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.route .city{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.route .t{font-size:15px;font-weight:600}
.route .mid{flex:1;text-align:center;color:var(--mute);font-size:12px}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:5px;position:relative;margin:7px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:5px;box-shadow:0 0 12px rgba(126,240,220,.6)}
.bar b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;color:#fff;filter:drop-shadow(0 0 6px rgba(126,240,220,.9))}
.right{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--stroke-lo)}
.pill.ok{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.air{color:var(--acc2)}
.muted{color:var(--mute)}.small{font-size:13px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 6px 8px;font-weight:700}
.empty{text-align:center;padding:36px 20px;color:var(--mute)}
.empty svg{width:60px;height:60px;opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:var(--r);padding:16px}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--mute);font-size:12px}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(3,6,15,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet>div{width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:32px 32px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));background:rgba(22,28,48,.62);animation:up .32s cubic-bezier(.2,.9,.25,1)}
.sheet>div::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet .hd h3{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;color:var(--mute);margin:0 0 5px 4px;font-weight:600}
input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;border-radius:14px;padding:12px 14px;outline:none;background:rgba(255,255,255,.07);border:1px solid var(--stroke);box-shadow:0 1px 2px rgba(0,0,0,.25) inset;font-size:16px;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{border-color:rgba(126,240,220,.7);box-shadow:0 0 0 4px rgba(126,240,220,.15)}
input[type=date],input[type=time]{min-height:48px;color-scheme:dark;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
.row>label.f{min-width:0;overflow:hidden}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.map{height:240px;border-radius:var(--r);overflow:hidden;border:1px solid var(--stroke);margin-bottom:12px;background:rgba(10,16,34,.6)}
.map.big{height:300px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kv>div{border-radius:16px;padding:9px 11px}
.kv .k{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv .v{font-weight:700}
.timeline{border-left:2px solid rgba(255,255,255,.15);margin:6px 0 6px 10px;padding-left:18px}
.timeline div{position:relative;padding:7px 0}
.timeline div:before{content:"";position:absolute;left:-25px;top:12px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(7,11,24,.8)}
.timeline div.done:before{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 18px;border-radius:999px;z-index:60;font-weight:600;white-space:nowrap;background:rgba(40,48,72,.7);animation:up .25s}
.chk{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--stroke-lo)}
.chk:last-child{border:0}
.chk input{width:22px;height:22px;accent-color:#7ef0dc;box-shadow:none}
.seg{display:flex;border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;color:var(--mute);cursor:pointer;font-weight:600;font-size:14px;transition:all .25s}
.seg button.on{background:rgba(255,255,255,.17);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 12px rgba(0,0,0,.25)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--stroke-lo)}
.list-row:last-child{border:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.35);box-shadow:var(--shadow)}
.avatar.lg{width:58px;height:58px;font-size:23px}
.countdown{font-size:13px;color:var(--acc);margin-top:10px;font-weight:600}
.leaflet-container{background:#0a1022;font:inherit}
.leaflet-tooltip{background:rgba(20,26,44,.8);color:#fff;border:1px solid var(--stroke);border-radius:8px;box-shadow:none;font-weight:700}
.leaflet-tooltip-top:before{display:none}
.plane-ico{color:#fff;filter:drop-shadow(0 0 6px rgba(126,240,220,.9))}
a{color:var(--acc2)}
code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:12px}
details summary{cursor:pointer}

/* Quick add + detection chip */
.quick{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 16px;margin-bottom:8px}
.quick input{border:0;background:none;box-shadow:none;padding:8px 0;font-size:17px;-webkit-backdrop-filter:none;backdrop-filter:none}
.quick input:focus{box-shadow:none}
.quick .icon-btn{width:38px;height:38px;flex:none}
.chip{display:flex;align-items:center;gap:10px;border-radius:18px;padding:9px 12px;margin:0 0 12px;font-size:14px;animation:up .25s}
.chip .sp{flex:1;min-width:0}
.chip b{display:block}
.chip.hint{color:var(--mute)}
.detect-slot:empty{display:none}

/* Auth */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.auth-card{width:100%;max-width:400px;border-radius:32px;padding:28px 22px 22px}
.auth-logo{width:76px;height:76px;margin:0 auto 12px;display:block;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.3) inset}
.auth h1{text-align:center;font-size:30px;margin:0;font-weight:800;letter-spacing:-.03em}
.auth p.sub{text-align:center;color:var(--mute);margin:4px 0 20px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:-2px 4px 10px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:6px}

/* v3: flights list, add flow, flight detail, passport */
.map.hero{height:34vh;min-height:200px;max-height:330px;margin:0 0 12px;cursor:pointer}

button.quick{width:100%;color:inherit;text-align:left;cursor:pointer;padding:12px 8px 12px 16px;font-size:16px}
.quick .sp{flex:1}.quick .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(126,240,220,.9);color:#04231f;font-weight:800;font-size:20px;line-height:1}
.card.list{padding:4px 14px}
.frow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--stroke-lo);cursor:pointer}
.frow:last-child{border:0}
.cd{width:54px;flex:none;text-align:center;padding-top:4px}
.cd b{display:block;font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
.cd span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
.cd.air b{color:var(--acc)}
.fr-main{flex:1;min-width:0}
.fr-top{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin-bottom:4px}
.fr-top .sp{flex:1}.fr-top .badge{width:22px;height:22px;font-size:9px}
.fr-title{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-times{display:flex;gap:16px;font-size:15px;font-weight:600;flex-wrap:wrap}
.fr-times i{font-style:normal;color:var(--mute);font-size:12px}.fr-times em{font-style:normal;color:var(--mute)}
sup{font-size:.6em;margin-left:1px}
.yearhd{display:flex;justify-content:space-between;align-items:baseline;margin:20px 6px 8px}
.yearhd b{font-size:20px}.yearhd span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;position:relative;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer;color:var(--mute);background:rgba(255,255,255,.06);border:1px solid var(--stroke-lo);white-space:nowrap}
.chipbtn.on{color:var(--text);background:rgba(255,255,255,.17);border-color:var(--stroke);box-shadow:0 1px 0 rgba(255,255,255,.3) inset}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.bigfield{display:flex;align-items:center;gap:10px;border-radius:20px;padding:4px 16px;margin-bottom:12px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.bigfield input{border:0;background:none;box-shadow:none;font-size:26px;font-weight:700;padding:12px 0;letter-spacing:.02em}
.bigfield input:focus{box-shadow:none}
.hint{margin:4px 6px 12px}
.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.link{background:none;border:0;color:var(--acc2);font-weight:600;font-size:14px;padding:8px 10px;cursor:pointer}
.searching{display:flex;align-items:center;gap:12px;color:var(--mute)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result .route{margin-top:6px}.result .mid svg{color:var(--acc)}
.sheet>div.has-map{padding-top:0}
.map.dmap{height:230px;margin:0 -18px 0;border-radius:32px 32px 0 0;border:0;border-bottom:1px solid var(--stroke)}
.sheet>div:has(.dmap)::before{display:none}
.sheet>div:has(.dmap){padding-top:0}
.dhead{display:flex;gap:12px;align-items:flex-start;margin:16px 0 12px}
.dhead .sp{flex:1;min-width:0}.dhead h3{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.caps{text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.statusbox{border-radius:20px;padding:14px 16px;margin-bottom:16px;background:rgba(255,255,255,.07);border:1px solid var(--stroke)}
.statusbox b{display:block;font-size:19px}.statusbox span{color:var(--mute);font-size:14px}
.statusbox.warn b{color:var(--warn)}.statusbox.bad b{color:var(--bad)}.statusbox.air b{color:var(--acc)}
.leg{padding:4px 2px}
.lh{font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lh b{color:var(--text)}
.lh i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);font-size:11px;color:var(--text)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.bigt{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
button.plain{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.gatechip{border-radius:16px;padding:8px 14px;text-align:right;cursor:pointer;color:inherit;background:rgba(126,240,220,.08);border:1px solid rgba(126,240,220,.45);min-width:84px}
.gatechip b{display:block;font-size:22px;color:var(--acc)}.gatechip span{font-size:12px;color:var(--mute)}
.legmid{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;margin:14px 2px;padding-bottom:14px;border-bottom:1px solid var(--stroke-lo)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}
.tile{text-align:left;border-radius:20px;padding:14px;cursor:pointer;color:inherit;background:rgba(255,255,255,.07);border:1px solid var(--stroke);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .ti{font-size:20px}.tile b{font-size:15px}.tile span:last-child{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.wide{width:100%}
.pcard{border-radius:28px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:var(--shadow)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.pcard.p1{background:linear-gradient(160deg,#1c2a7a,#3b1d6e 60%,#22346e)}
.pcard.p2{background:linear-gradient(160deg,#7a1f2b,#3d0f1a)}
.pcard.p3{background:linear-gradient(160deg,#0f5e63,#103a52)}
.pcard.p4{background:linear-gradient(160deg,#6b4a12,#3b2a0e)}
.ph{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-bottom:14px;opacity:.9}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.pgrid span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:700}
.pgrid b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pgrid em{font-style:normal;font-size:13px;opacity:.75}
.pgrid .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hugeN{font-size:72px;line-height:1;font-weight:800;letter-spacing:-.04em}
.bigN{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.pt{font-size:20px;font-weight:700}.ps{opacity:.75;font-size:15px}
[hidden]{display:none!important}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;margin:14px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--stroke)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.92);color:#1f1f1f;border-color:rgba(255,255,255,.9)}

/* v5: globe home */
#globe{position:fixed;inset:0;z-index:0;display:none;background:radial-gradient(circle at 50% 40%,#0b1430,#02040a 70%)}
body.home #globe{display:block}
body.home .aurora{display:none}
body.home main{position:relative;z-index:1;padding-top:calc(46vh + env(safe-area-inset-top));pointer-events:none}
body.home main>*{pointer-events:auto}
body.home header{background:linear-gradient(180deg,rgba(2,4,10,.7),rgba(2,4,10,0));-webkit-mask-image:none;mask-image:none;pointer-events:none}
body.home header *{pointer-events:auto}
body.home .hdr h1{text-shadow:0 2px 18px rgba(0,0,0,.6)}
header{z-index:20}
.homepanel{margin:0 -16px;padding:16px 16px 140px;min-height:62vh;border-radius:34px 34px 0 0;background:rgba(12,16,30,.74);-webkit-backdrop-filter:saturate(170%) blur(30px);backdrop-filter:saturate(170%) blur(30px);border:1px solid var(--stroke);border-bottom:0;box-shadow:0 -1px 0 rgba(255,255,255,.25) inset,0 -20px 50px rgba(0,0,0,.45)}
.homepanel::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:-6px auto 12px}
.homepanel .card.list{background:rgba(255,255,255,.05)}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(0,0,0,.4)!important;color:#999!important}
.maplibregl-ctrl-attrib a{color:#bbb!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.5}
body.home .maplibregl-ctrl-bottom-right{bottom:auto;top:calc(52px + env(safe-area-inset-top))}
.gpin{display:flex;align-items:center;font-weight:700;font-size:11px;white-space:nowrap;pointer-events:none;letter-spacing:0}
.gpin.l{flex-direction:row-reverse}
.gpin i{width:12px;height:12px;border-radius:50%;background:#8fd0ff;border:2px solid #fff;box-shadow:0 0 10px #8fd0ff;flex:none}
.gpin.r i{margin-right:6px}.gpin.l i{margin-left:6px}
.gpin span{background:rgba(30,90,200,.9);padding:3px 6px;color:#fff}
.gpin b{background:rgba(12,40,110,.95);padding:3px 6px;color:#fff}
.gpin.r span{border-radius:7px 0 0 7px}.gpin.r b{border-radius:0 7px 7px 0}
.gpin.l b{border-radius:0 7px 7px 0;order:-1}.gpin.l span{border-radius:7px 0 0 7px;order:-2}
.gplane{color:#fff;filter:drop-shadow(0 0 8px rgba(126,240,220,.9))}
.map.dmap{height:260px;background:#02040a}
.map.nomap{display:none}
.srcnote{font-size:13px;color:var(--mute);margin:10px 2px 0;line-height:1.45}
.srcnote.warn{color:var(--warn)}.srcnote.ok{color:var(--good)}
.link.inl{padding:0;font-size:13px;display:inline}
.steps{padding-left:20px;margin:6px 0 12px}.steps li{margin-bottom:4px}

/* v6: full-screen flight view with draggable sheet */
.fview{position:fixed;inset:0;z-index:50;background:#02040a;animation:fade .2s}
.fview .fmap{position:absolute;inset:0}
.fview .fmap.nomap{display:block;background:radial-gradient(circle at 50% 30%,#0b1430,#02040a 70%)}
.dsheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;height:calc(100% - 56px - env(safe-area-inset-top));display:flex;flex-direction:column;border-radius:32px 32px 0 0;background:rgba(16,20,36,.8);-webkit-backdrop-filter:saturate(170%) blur(30px);backdrop-filter:saturate(170%) blur(30px);border:1px solid var(--stroke);border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -16px 40px rgba(0,0,0,.45);transition:transform .38s cubic-bezier(.2,.9,.25,1);will-change:transform}
.grabzone{padding:8px 18px 0;touch-action:none;cursor:grab;flex:none}
.grabber{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);margin:0 auto 4px}
.grabzone .dhead{margin:10px 0 12px}
.dscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 18px calc(30px + env(safe-area-inset-bottom))}
.fview .maplibregl-ctrl-top-right,.fview .maplibregl-ctrl-bottom-right{top:calc(8px + env(safe-area-inset-top));bottom:auto}
.sheet>div{overscroll-behavior:contain}
.liveln{display:block;margin-top:4px;font-size:13px;color:var(--acc)}
.gplane.live{filter:drop-shadow(0 0 10px rgba(126,240,220,1))}
.srcnote.live{color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--stroke-lo);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.srcnote.live.bad{color:var(--bad)}
.alogo{position:relative;display:inline-grid;width:26px;height:26px;flex:none}
.alogo .badge{width:100%;height:100%}
.alogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:7px;padding:2px;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.alogo.lg{width:46px;height:46px}.alogo.lg img{border-radius:12px;padding:4px}
.fr-top .alogo{width:22px;height:22px}.fr-top .alogo img{border-radius:6px}
.listhd{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px}.listhd b{font-size:20px;letter-spacing:-.02em}
.listhd .link{padding:0}
.gplane2{position:relative;width:48px;height:48px;display:grid;place-items:center;pointer-events:none}
.gplane2 .hdg{position:absolute;inset:0;width:100%;height:100%;color:#8fd0ff;transition:transform .4s;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.gplane2.live .hdg{color:#7ef0dc}
.gplane2 .alogo{width:30px;height:30px}
.gplane2 .alogo img,.gplane2 .alogo .badge{border-radius:50%!important;box-shadow:0 0 0 2.5px #8fd0ff,0 4px 12px rgba(0,0,0,.6)}
.gplane2.live .alogo img,.gplane2.live .alogo .badge{box-shadow:0 0 0 2.5px #7ef0dc,0 0 14px rgba(126,240,220,.8)}
.late{color:#ff6b6b!important}.early{color:#5ee08a!important}
.fr-times b{font-weight:600}

/* v14: dock, full-height home sheet, clean header over the globe */
.dock{position:fixed;z-index:30;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:10px;padding:0 12px;pointer-events:none}
.dock>*{pointer-events:auto}
nav.tabs{width:auto}
.dock-search{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--text);background:rgba(255,255,255,.09);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--shadow);transition:transform .15s}
.dock-search:active{transform:scale(.93)}
html,body{height:100%}
body.home{overflow:hidden;background:#02040a}
body.home main{padding:0;max-width:none}
body.home header{background:linear-gradient(180deg,rgba(2,4,10,.55),rgba(2,4,10,0));-webkit-backdrop-filter:none;backdrop-filter:none;-webkit-mask-image:none;mask-image:none}
.hsheet{position:fixed;z-index:5;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;height:calc(100dvh - 64px - env(safe-area-inset-top));display:flex;flex-direction:column;border-radius:34px 34px 0 0;background:rgba(12,16,30,.78);-webkit-backdrop-filter:saturate(170%) blur(30px);backdrop-filter:saturate(170%) blur(30px);border:1px solid var(--stroke);border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -20px 50px rgba(0,0,0,.45);transition:transform .38s cubic-bezier(.2,.9,.25,1);will-change:transform;touch-action:pan-x}
.hgrab{padding:10px 0 6px;flex:none;cursor:grab}
.hscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(130px + env(safe-area-inset-bottom))}
.hscroll .card.list{background:rgba(255,255,255,.05)}
.dsheet{touch-action:pan-x}
</style>
</head>
<body>
<div id="globe" aria-label="Map of your flights"></div>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header><div class="hdr"><h1 id="title">Flights</h1>
  <div class="avatar" id="hdrAvatar" data-tab="settings"></div></div></header>
<main id="main"></main>
<div class="dock" id="dock"><nav class="tabs" id="tabs"></nav><button class="dock-search" id="dockSearch" aria-label="Add a flight"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg></button></div>
<input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
<script src="airports.js?v=15"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js" defer></script>
<script src="app.js?v=15"></script>
</body>
</html>
