<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Contrail — Flight Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#24314f;--text:#e8edf7;--mute:#8b98b3;--acc:#5eead4;--acc2:#38bdf8;--warn:#fbbf24;--bad:#f87171;--good:#4ade80;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
header h1 span{color:var(--acc)}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(15,23,40,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.pri{background:var(--acc);color:#04201c;border-color:var(--acc);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.icon-btn{background:var(--card2);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.fcard{cursor:pointer;position:relative;overflow:hidden}
.fcard .top{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:8px}
.route{display:flex;align-items:center;gap:10px}
.route .ap{min-width:0}
.route .code{font-size:30px;font-weight:700;letter-spacing:1px}
.route .city{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.route .t{font-size:15px;font-weight:600}
.route .mid{flex:1;text-align:center;color:var(--mute);font-size:12px}
.bar{height:4px;background:var(--line);border-radius:4px;position:relative;margin:6px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:4px}
.bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;color:var(--acc)}
.right{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2)}
.pill.ok{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.air{color:var(--acc2)}
.muted{color:var(--mute)}
.small{font-size:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:18px 4px 8px}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty svg{width:64px;height:64px;opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font-size:26px;font-weight:700}
.stat .l{color:var(--mute);font-size:12px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .hd h3{flex:1;margin:0;font-size:18px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1}
.map{height:240px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#0e1830}
.map.big{height:320px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kv>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv .k{font-size:11px;color:var(--mute);text-transform:uppercase}
.kv .v{font-weight:600}
.timeline{border-left:2px solid var(--line);margin:6px 0 6px 8px;padding-left:16px}
.timeline div{position:relative;padding:6px 0}
.timeline div:before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.timeline div.done:before{background:var(--acc)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.chk input{width:auto}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.list-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%}
.countdown{font-size:13px;color:var(--acc);margin-top:8px}
.leaflet-container{background:#0e1830}
.plane-ico{color:var(--acc);filter:drop-shadow(0 0 4px #000)}
a{color:var(--acc2)}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 64 64"><path d="M6 46c14-2 26-10 36-24" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/><path d="M14 52c14-2 26-10 36-24" stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="52" cy="18" r="6" fill="#e8edf7"/></svg>
  <h1>Con<span>trail</span></h1>
  <button class="icon-btn" id="hdrAction" aria-label="Add flight"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>

<script src="airports.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="app.js"></script>
</body>
</html>
